name: pip-audit

# Verifica vulnerabilidades conhecidas (CVE) nas dependências Python.
on:
  push:
    paths: ['requirements.txt']
  pull_request:
    paths: ['requirements.txt']
  schedule:
    - cron: '0 6 * * 1'   # toda segunda, 06h UTC
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar pip-audit
        run: pip install pip-audit
      - name: Auditar requirements.txt
        run: pip-audit -r requirements.txt --strict
